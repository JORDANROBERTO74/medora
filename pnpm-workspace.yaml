pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

# unrs-resolver: napi-postinstall checks the platform binding, needed by eslint-plugin-import
allowBuilds:
  unrs-resolver: true

# Security audit fixes for transitive build-time dependencies (pnpm 11 reads
# settings from this file, not package.json).
overrides:
  baseline-browser-mapping: 2.11.0
  nanoid: 3.3.18
  source-map-js: 1.2.2
